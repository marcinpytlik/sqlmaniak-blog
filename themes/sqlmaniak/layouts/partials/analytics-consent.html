{{ with .Site.Params.analytics.measurementid }}
<div id="site-pref-config" data-measurement-id="{{ . }}" hidden></div>
<aside id="site-pref-banner" class="site-preferences" role="region" aria-label="{{ i18n "consentAria" }}" hidden>
  <strong>{{ i18n "consentTitle" }}</strong>
  <p>{{ i18n "consentText" }}</p>
  <button type="button" data-site-preferences="accepted">{{ i18n "consentAccept" }}</button>
  <button type="button" data-site-preferences="rejected">{{ i18n "consentReject" }}</button>
</aside>
<aside id="site-pref-settings" class="site-preferences" role="region" aria-label="{{ i18n "analyticsSettings" }}" hidden>
  <strong>{{ i18n "analyticsSettings" }}</strong>
  <p>{{ i18n "settingsText" }}</p>
  <button type="button" data-site-preferences="accepted">{{ i18n "consentAccept" }}</button>
  <button type="button" data-site-preferences="rejected">{{ i18n "settingsReject" }}</button>
</aside>
<script src="/js/site-preferences.js" defer></script>
{{ end }}
