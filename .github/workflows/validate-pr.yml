name: Validate Hugo and GA4 consent
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.150.0'
          extended: true
      - name: Build Hugo
        run: hugo --minify
      - name: Check GA4 consent integration
        run: python3 scripts/test_ga4_integration.py
