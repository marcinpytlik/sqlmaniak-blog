name: Deploy Hugo site to Pages
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
  # GitHub Actions cron is UTC. Check both Polish offsets and run only at 08:15 Warsaw time.
  schedule:
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  schedule-check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check Warsaw publishing window
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ "$(TZ=Europe/Warsaw date +%H)" == "08" ]]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: schedule-check
    if: needs.schedule-check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build
        run: hugo --minify
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
