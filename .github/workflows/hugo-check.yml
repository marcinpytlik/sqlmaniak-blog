name: Validate Hugo multilingual build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
      - name: Build site
        run: hugo --minify --printI18nWarnings
      - name: Verify Polish URLs and English translation
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/posts/podzial-tabeli-bez-big-bang/index.html
          test -f public/en/index.html
          test -f public/en/posts/split-table-without-big-bang/index.html
          grep -q 'hreflang="en"' public/posts/podzial-tabeli-bez-big-bang/index.html
          grep -q 'hreflang="pl"' public/en/posts/split-table-without-big-bang/index.html
          grep -q 'lang="en"' public/en/posts/split-table-without-big-bang/index.html
          grep -q 'rel="canonical"' public/en/posts/split-table-without-big-bang/index.html
